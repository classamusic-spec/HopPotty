# HopPotty — XcodeGen project definition.
#
# This file is the canonical description of the Xcode project. `HopPotty.xcodeproj`
# is a build artefact: generated by `Scripts/bootstrap.sh`, git-ignored, and safe
# to delete at any time. Never edit the project in Xcode's target editor and
# expect it to survive — edit this file and re-run bootstrap.
#
# Why generate rather than commit a .pbxproj: four targets share four source
# files, three of them are Screen Time extensions whose misconfiguration fails
# silently at runtime rather than loudly at build time, and none of it can be
# reviewed in a diff of a .pbxproj. Here it can.
#
# NOT VERIFIED. This repository has no Xcode and no XcodeGen, so nothing below
# has been generated, let alone built. Every value is derived from Apple's
# documentation, from Docs/Entitlements.md and Docs/ScreenTimeArchitecture.md, or
# from the constants in HopPotty/Services/ScreenTime/ScreenTimeIdentifiers.swift.
# The residual uncertainties are marked "UNVERIFIED" in place.

name: HopPotty

options:
  # Used only where a target does not set PRODUCT_BUNDLE_IDENTIFIER itself.
  # Every target below sets it explicitly, from Config/Base.xcconfig.
  bundleIdPrefix: com.hoppotty
  deploymentTarget:
    iOS: "17.0"          # Docs/ADR/0002-deployment-target.md. Also set in
                         # Config/Base.xcconfig and HopPottyKit/Package.swift;
                         # Scripts/verify-config.sh checks all three agree.
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  defaultConfig: Debug
  # `optional: true` on a source path (used below) needs a reasonably recent
  # XcodeGen. Scripts/bootstrap.sh enforces this same floor before generating.
  minimumXcodeGenVersion: "2.38.0"
  # Extensions are embedded explicitly, one line per extension, below. Turning
  # transitive linking off keeps that list honest.
  transitivelyLinkDependencies: false

# Three configurations, not two. See Config/DebugMock.xcconfig for what the third
# one buys: a build whose services are fakes chosen at COMPILE time, so the
# simulator, UI tests and screenshots never depend on Family Controls — which
# may not work in the Simulator at all (ScreenTimeArchitecture.md §12.7).
configs:
  Debug: debug
  DebugMock: debug
  Release: release

# Project-level xcconfigs. Deliberately the only place build settings live,
# apart from the per-target identity settings (bundle ID, Info.plist,
# entitlements) that belong next to the target they describe.
configFiles:
  Debug: Config/Debug.xcconfig
  DebugMock: Config/DebugMock.xcconfig
  Release: Config/Release.xcconfig

packages:
  # Local package, referenced by path — no remote dependency, no Package.resolved
  # to drift, and `swift test` in HopPottyKit/ keeps working with no Xcode at all.
  HopPottyKit:
    path: HopPottyKit

# Files that belong to no target but should be readable in the Xcode navigator.
fileGroups:
  - Config
  - Docs
  - Scripts
  - .github
  - project.yml
  - README.md

targets:

  # ---------------------------------------------------------------------------
  # The app
  # ---------------------------------------------------------------------------
  HopPotty:
    type: application
    platform: iOS
    sources:
      - path: HopPotty
        excludes:
          # Referenced by the scheme, not bundled into the app. A StoreKit
          # configuration file inside the .app would ship test products.
          - "Resources/HopPotty.storekit"
          # Consumed through INFOPLIST_FILE and CODE_SIGN_ENTITLEMENTS below.
          # Without these excludes they would ALSO be picked up as resources and
          # copied into the bundle, and a second Info.plist landing at the same
          # path is a "multiple commands produce" build failure.
          - "App/Info.plist"
          - "App/HopPotty.entitlements"
          - "**/.DS_Store"
      - path: HopPotty/Resources/HopPotty.storekit
        # Visible in the navigator, member of no build phase.
        buildPhase: none
    dependencies:
      - package: HopPottyKit
        product: HopPottyCore
      - package: HopPottyKit
        product: HopPottyDesignTokens
      # Embedding is what puts the three .appex bundles in HopPotty.app/PlugIns.
      # An extension that is built but not embedded is an extension the system
      # never sees: no error, no shield, no callback.
      - target: HopPottyDeviceActivityMonitor
        embed: true
      - target: HopPottyShieldConfiguration
        embed: true
      - target: HopPottyShieldAction
        embed: true
    settings:
      base:
        PRODUCT_NAME: HopPotty
        PRODUCT_BUNDLE_IDENTIFIER: "$(HOPPOTTY_APP_BUNDLE_ID)"
        INFOPLIST_FILE: HopPotty/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: HopPotty/App/HopPotty.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  # ---------------------------------------------------------------------------
  # Extension 1 of 3 — DeviceActivityMonitor
  #
  # Wall-clock end of a pause, plus the 15-minute backstop. Links DeviceActivity
  # and ManagedSettings. Must never link SwiftUI, SwiftData or DesignTokens:
  # this process is woken by the system with a small time and memory budget
  # (ScreenTimeArchitecture.md §4, §8) and everything it needs has been
  # pre-resolved into the App Group by the app.
  # ---------------------------------------------------------------------------
  HopPottyDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/HopPottyDeviceActivityMonitor
        excludes:
          - "Info.plist"
          - "*.entitlements"
      # The four files that must be members of all four targets. This list is
      # the machine-readable form of the "Target membership" comment at the top
      # of ScreenTimeIdentifiers.swift — if the two disagree, the app and its
      # extensions disagree about the App Group identifier or the
      # ManagedSettings store name, and a disagreement about the store name is
      # exactly the bug that strands a shield the app cannot clear.
      #
      # `optional: true` so a rename in the Screen Time layer produces a missing
      # symbol at compile time rather than an XcodeGen failure that blocks
      # everyone. Scripts/verify-config.sh reports which of the four are absent.
      - path: HopPotty/Services/ScreenTime/ScreenTimeIdentifiers.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/AppGroupStore.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/SharedPauseTypes.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/ShieldReconciler.swift
        optional: true
    dependencies:
      - package: HopPottyKit
        product: HopPottyCore
    settings:
      base:
        PRODUCT_NAME: HopPottyDeviceActivityMonitor
        PRODUCT_BUNDLE_IDENTIFIER: "$(HOPPOTTY_MONITOR_BUNDLE_ID)"
        INFOPLIST_FILE: Extensions/HopPottyDeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/HopPottyDeviceActivityMonitor/HopPottyDeviceActivityMonitor.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # ---------------------------------------------------------------------------
  # Extension 2 of 3 — ShieldConfiguration (ManagedSettingsUI)
  #
  # Draws the shield the child sees. Time-limited: a slow or crashed data source
  # yields Apple's default shield, with Apple's copy instead of HopCopy's
  # (ScreenTimeArchitecture.md §11.5). It therefore computes nothing — it reads
  # a ShieldPresentation the app already resolved.
  # ---------------------------------------------------------------------------
  HopPottyShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/HopPottyShieldConfiguration
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: HopPotty/Services/ScreenTime/ScreenTimeIdentifiers.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/AppGroupStore.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/SharedPauseTypes.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/ShieldReconciler.swift
        optional: true
    dependencies:
      - package: HopPottyKit
        product: HopPottyCore
    settings:
      base:
        PRODUCT_NAME: HopPottyShieldConfiguration
        PRODUCT_BUNDLE_IDENTIFIER: "$(HOPPOTTY_SHIELD_CONFIG_BUNDLE_ID)"
        INFOPLIST_FILE: Extensions/HopPottyShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/HopPottyShieldConfiguration/HopPottyShieldConfiguration.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # ---------------------------------------------------------------------------
  # Extension 3 of 3 — ShieldAction (ManagedSettings)
  #
  # Handles the child's tap on the shield: clears the store itself and appends an
  # outcome for the app to drain. Note the extension point lives in
  # ManagedSettings, not ManagedSettingsUI — see this target's Info.plist.
  # ---------------------------------------------------------------------------
  HopPottyShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/HopPottyShieldAction
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: HopPotty/Services/ScreenTime/ScreenTimeIdentifiers.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/AppGroupStore.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/SharedPauseTypes.swift
        optional: true
      - path: HopPotty/Services/ScreenTime/ShieldReconciler.swift
        optional: true
    dependencies:
      - package: HopPottyKit
        product: HopPottyCore
    settings:
      base:
        PRODUCT_NAME: HopPottyShieldAction
        PRODUCT_BUNDLE_IDENTIFIER: "$(HOPPOTTY_SHIELD_ACTION_BUNDLE_ID)"
        INFOPLIST_FILE: Extensions/HopPottyShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/HopPottyShieldAction/HopPottyShieldAction.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # ---------------------------------------------------------------------------
  # Tests
  #
  # These cover the app layer only — SwiftUI, SwiftData, the service seams. The
  # domain logic is tested in HopPottyKit with `swift test`, on Linux, in CI, on
  # every push. Anything testable there should be tested there: it runs in
  # seconds, needs no simulator, and is the reason this repository has real test
  # coverage at all (Docs/RepositoryAudit.md).
  # ---------------------------------------------------------------------------
  HopPottyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        optional: true
    dependencies:
      - target: HopPotty
      - package: HopPottyKit
        product: HopPottyFixtures
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(HOPPOTTY_APP_BUNDLE_ID).tests"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HopPotty.app/HopPotty"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HopPottyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        optional: true
    dependencies:
      - target: HopPotty
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(HOPPOTTY_APP_BUNDLE_ID).uitests"
        TEST_TARGET_NAME: HopPotty

schemes:

  # The everyday scheme. Runs against the real Screen Time frameworks, so it
  # needs a signed device build and a Family Controls-enabled App ID.
  HopPotty:
    build:
      targets:
        HopPotty: all
        HopPottyTests: [test]
        HopPottyUITests: [test]
    run:
      config: Debug
      # Makes StoreKit testing use the local products instead of App Store
      # Connect, so the paywall works with no sandbox account and no network.
      # UNVERIFIED: the XcodeGen key name (`storeKitConfiguration` under `run`)
      # is from XcodeGen's scheme documentation and has not been generated here.
      # If bootstrap reports an unknown key, delete these two lines and set the
      # file in Xcode: Product > Scheme > Edit Scheme > Run > Options > StoreKit
      # Configuration.
      storeKitConfiguration: HopPotty/Resources/HopPotty.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - HopPotty
      targets:
        - HopPottyTests
        - HopPottyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Fakes everywhere, chosen at compile time. This is the scheme to use in the
  # Simulator, for UI tests, for screenshots, and for any work on the app before
  # the Family Controls entitlement is approved. It proves nothing about Screen
  # Time — see Config/DebugMock.xcconfig.
  HopPotty-Mock:
    build:
      targets:
        HopPotty: all
        HopPottyTests: [test]
        HopPottyUITests: [test]
    run:
      config: DebugMock
      storeKitConfiguration: HopPotty/Resources/HopPotty.storekit
    test:
      config: DebugMock
      gatherCoverageData: true
      coverageTargets:
        - HopPotty
      targets:
        - HopPottyTests
        - HopPottyUITests
    profile:
      config: DebugMock
    analyze:
      config: DebugMock
    archive:
      config: DebugMock
