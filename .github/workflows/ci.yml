# HopPotty — continuous integration.
#
# What this can and cannot prove.
#
# It runs the HopPottyKit test suite on Linux. That is not a subset of the app's
# tests — it is where the product's hardest logic deliberately lives: interval
# arithmetic across daylight-saving boundaries, quiet-hour precedence, reward
# idempotency, the Potty Pause state machine and its cold-start recovery, and the
# child-safety copy rules. All of it is Foundation-only by construction
# (Docs/ADR/0001-platform-agnostic-core.md), so it compiles and runs on a free
# Linux runner in seconds, on every push.
#
# The `app` job below is the macOS runner that job comment used to ask for. It
# builds the app, the three Screen Time extensions and the widget extension with
# a real Xcode, which is the only way anything SwiftUI in this repository gets
# type-checked at all: every one of those files was written without a compiler
# (Docs/RepositoryAudit.md), so until this job is green, "it parses" is the
# strongest claim anyone can make about them.
#
# EXPECT IT TO FAIL THE FIRST TIME, and read that as the job working. Nothing
# here had ever been compiled when it was added; its whole purpose is to turn a
# pile of unverified files into a specific list of errors. `Docs/FirstBuild.md`
# is where that list is worked through.
#
# It still cannot prove anything about Screen Time. The mock scheme swaps the
# whole Family Controls layer out at compile time, and the Simulator has no
# meaningful implementation of it either way — that needs a physical device and
# an approved entitlement (Docs/Entitlements.md).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hoppottykit:
    name: HopPottyKit tests (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.2 is the toolchain the suite was last run green on.
        # 6.0 is the floor HopPottyKit/Package.swift claims with
        # `swift-tools-version: 6.0`. A claimed floor that is never compiled is a
        # guess, so it is compiled here. If the 6.0 job fails, the honest fixes
        # are to change the source or to raise the tools version — not to delete
        # this matrix entry.
        swift: ["6.0", "6.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift ${{ matrix.swift }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Toolchain
        run: swift --version

      # Build first, so a compile failure is reported as a compile failure rather
      # than buried in the test runner's output.
      - name: Build
        working-directory: HopPottyKit
        run: swift build --build-tests

      - name: Test
        working-directory: HopPottyKit
        run: swift test

  configuration:
    name: Build configuration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Swift, no Xcode, no XcodeGen — pure text comparison. It catches the
      # class of mistake that is invisible at build time and total at runtime:
      # an App Group that disagrees between the entitlements and the code, a
      # deployment target that has drifted from ADR 0002, a HOPPOTTY_DEBUG_TOOLS
      # that has appeared in the Release configuration, or committed signing
      # material.
      - name: Verify configuration
        run: Scripts/verify-config.sh

      # Every illustration the content layer names has to have a drawing behind
      # it. A missing one is not a build error — `HopArtwork` falls back to a
      # placeholder — so without this the app ships coloured blobs and says
      # nothing about it.
      - name: Verify the art
        run: Scripts/check-art.sh

  app:
    name: App and extensions (Xcode)
    runs-on: macos-15
    # A bound, because the default is six hours. A runaway type-check -- "unable
    # to type-check this expression in reasonable time" is a real and common
    # SwiftUI failure -- would otherwise burn all six and report nothing. This
    # was added after run 61 appeared to hang for forty-six minutes; it had not,
    # the API's job status was simply stale (Docs/FirstBuild.md, layer 6), but a
    # build job with no clock is worth fixing on its own account.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pinning by picking the newest installed Xcode rather than a fixed path:
      # the runner image's Xcode set changes without notice, and a hard-coded
      # /Applications/Xcode_16.2.app turns into a broken build months later for
      # a reason that has nothing to do with the code.
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # bootstrap.sh does the whole setup: it creates Config/Secrets.xcconfig
      # from the template (empty team, which is correct here — this job never
      # signs), runs the configuration checks, and generates the project. It is
      # the same command a person runs, so if it breaks for them it breaks here.
      - name: Generate the Xcode project
        run: Scripts/bootstrap.sh

      # Bootstrap builds the illustration catalog from Art/. This asserts it
      # actually did: a bootstrap that silently skipped the step would still
      # produce a project that builds, and an app that draws placeholders.
      - name: Verify the illustration assets
        run: Scripts/build-assets.sh --check

      # CODE_SIGNING_ALLOWED=NO because a CI runner has no signing identity and
      # no provisioning profile, and a Simulator build needs neither. This is
      # also why the job cannot catch entitlement or provisioning mistakes —
      # those surface on a device, and Docs/RunningLocally.md covers them.
      # Two overrides beyond CODE_SIGNING_ALLOWED, both about not doing work
      # that proves nothing:
      #
      #   ARCHS=arm64 — a generic Simulator destination builds arm64 AND x86_64
      #   by default, which is two full code-generation passes over ~190 SwiftUI
      #   files to answer one question. Type checking, actor isolation and every
      #   Swift diagnostic this job exists to catch are architecture-independent,
      #   so the second pass finds nothing the first did not. Anyone who needs an
      #   Intel simulator slice is building locally, where the default still
      #   applies.
      #
      #   CLANG_ENABLE_CODE_COVERAGE=NO — the scheme gathers coverage for its
      #   *test* action, and this job never runs tests. Without this the compiler
      #   is handed -profile-generate and -profile-coverage-mapping and
      #   instruments every function in the app, for a profile nothing will ever
      #   read.
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HopPotty.xcodeproj \
            -scheme HopPotty-Mock \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            2>&1 | tee /tmp/xcodebuild.log

      # The full log, because the summary below is deliberately truncated and the
      # first error is often explained by something a hundred lines above it.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

      # Deliberately the LAST step, and deliberately printed to stdout as well as
      # to the job summary.
      #
      # xcodebuild's raw output is tens of thousands of lines, most of them a
      # single compiler invocation wrapped onto one line, and the dozen lines that
      # matter are scattered through it. Anyone — or anything — reading this job
      # by tailing its log gets the whole error list and nothing else, because
      # this runs after everything that would otherwise come after it.
      - name: Summarise diagnostics
        if: always()
        run: |
          set -uo pipefail
          log=/tmp/xcodebuild.log
          [ -f "$log" ] || { echo "No build log — the job failed before xcodebuild ran." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          strip() { sed "s#$GITHUB_WORKSPACE/##g"; }
          errors=$(grep -E '^[^ ]+\.swift:[0-9]+:[0-9]+: (error|warning):' "$log" | strip | sort -u || true)
          # `ld:` and `fatal error:` are included because a linker failure — a
          # framework the mock scheme should not be pulling in, say — carries no
          # "error:" at all and would otherwise vanish from this summary.
          others=$(grep -E '(^|[^.])error:|^ld: |^fatal error:' "$log" | grep -vE '\.swift:[0-9]+:[0-9]+: error:' | strip | sort -u || true)
          count() { printf '%s' "$1" | grep -c . || true; }
          {
            echo "## Xcode build"
            echo
            printf '%s Swift diagnostics, %s other errors\n\n' "$(count "$errors")" "$(count "$others")"
            if [ -n "$errors" ]; then
              echo "### Swift errors and warnings"
              echo "SWIFT_TREAT_WARNINGS_AS_ERRORS is on, so a warning here also fails the build."
              echo '```'; printf '%s\n' "$errors" | head -300; echo '```'
            fi
            if [ -n "$others" ]; then
              echo "### Other errors (linking, resources, signing)"; echo '```'; printf '%s\n' "$others" | head -100; echo '```'
            fi
            # A job killed by the timeout has no errors to report and no
            # "BUILD FAILED" line either, so without this it looks like a job
            # that did nothing. The last few compile tasks name what it was
            # still working on when the clock ran out.
            if [ -z "$errors" ] && [ -z "$others" ] && ! grep -q '\*\* BUILD SUCCEEDED \*\*' "$log"; then
              echo "### No diagnostics, and no successful build"
              echo "The build did not finish. It was last working on:"
              echo '```'
              grep -E '^(SwiftCompile|SwiftDriverJobDiscovery|Ld|CompileAssetCatalog) ' "$log" | tail -10 | strip
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
